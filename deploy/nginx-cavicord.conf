# Cavicord — Nginx server block (static prerendered site + API proxy)
# Place at /etc/nginx/sites-available/cavicord, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name cavicord.tech www.cavicord.tech;
    return 301 https://cavicord.tech$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cavicord.tech www.cavicord.tech;

    # Certbot-managed — keep your existing paths
    ssl_certificate /etc/letsencrypt/live/cavicord.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cavicord.tech/privkey.pem;

    root /opt/app/frontend/build;
    index index.html;

    # --- 301s: merged duplicate topics (keep in sync with src/data/redirects.js) ---
    location = /best-1-year-cd-rates  { return 301 /12-month-cd; }
    location = /best-6-month-cd-rates { return 301 /6-month-cd; }
    location = /high-yield-cd-rates   { return 301 /high-yield-cd; }
    location = /jumbo-cd-rates        { return 301 /jumbo-cd; }

    # --- API proxy (X-Forwarded-For is required for lead IP capture) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Hashed assets: cache hard ---
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Real 404 with branded page ---
    error_page 404 /404.html;
    location = /404.html { internal; }

    # --- Prerendered pages: exact file, else directory index, else 404 ---
    location / {
        try_files $uri $uri/index.html =404;
    }
}

# Daily rebuild so prerendered rates stay fresh — add with `sudo crontab -e`:
# 0 6 * * * cd /opt/app/frontend && yarn build >/dev/null 2>&1 && node prerender.mjs >> /var/log/cavicord-prerender.log 2>&1
