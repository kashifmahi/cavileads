<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#16233d" />
        <script>
            /* Real redirects for SPA hosting without server-side 301s (see vite.config.mjs):
               retired slugs -> their canonical page, on the same host.
               Host-level redirects (www <-> apex) are deliberately NOT done here: they belong
               to the hosting layer (Emergent Domain tab). Doing them in JS as well caused a
               redirect loop on Oct 30 when the host was set to apex -> www. */
            (function () {
                try {
                    var map = __CAVICORD_REDIRECTS__;
                    var path = location.pathname.replace(/\/+$/, "") || "/";
                    var to = map[path];
                    if (to && to !== path) {
                        location.replace(location.origin + to + location.search + location.hash);
                    }
                } catch (e) {}
            })();
        </script>
        <link rel="icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link
            rel="preload"
            as="image"
            href="/assets/logo-cavicord-v2-230.webp"
            imagesrcset="/assets/logo-cavicord-v2-230.webp 230w, /assets/logo-cavicord-v2-460.webp 460w, /assets/logo-cavicord-v2.webp 645w"
            imagesizes="230px"
            fetchpriority="high"
        />
        <!-- Bank logos come from Google's favicon service (www.google.com/s2 -> t0..t3.gstatic.com,
             sharded at random) and only appear in the rate table below the fold. Four full
             preconnects competed with the critical path and Lighthouse flagged them as unused;
             a DNS lookup hint is all that's worth doing this early. -->
        <link rel="dns-prefetch" href="https://www.google.com" />
        <link rel="dns-prefetch" href="https://t0.gstatic.com" />
        <script>
            window.__pre = {
                rates: fetch("/api/rates?term=all&rate_type=standard").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
                national: fetch("/api/national-rates").then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
            };
        </script>
        <meta name="msvalidate.01" content="AFFB57C95CBAD9A55B3455F5ECC67687" />
        <meta
            name="description"
            content="Compare today's best CD rates from top banks and credit unions. Updated daily with APYs, minimum deposits and early-withdrawal penalties, plus a free CD calculator."
            data-default="true"
        />
        <!-- No default canonical / og:url here on purpose: this one file is served for
             every route on SPA hosting, so a hard-coded "https://cavicord.tech/" made every
             page declare itself a duplicate of the homepage. Each route sets its own via
             <SEO> (react-helmet), and prerender.mjs bakes that into the static HTML. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Cavicord" />
        <meta property="og:title" content="Compare CD Rates — Today's Best CD Rates From Top Banks | Cavicord" data-default="true" />
        <meta
            property="og:description"
            content="Compare today's best CD rates from top banks and credit unions. Updated daily with APYs, minimum deposits and early-withdrawal penalties."
            data-default="true"
        />
        <meta property="og:image" content="https://cavicord.tech/og-image.png" data-default="true" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Compare CD Rates — Today's Best CD Rates From Top Banks | Cavicord" data-default="true" />
        <meta
            name="twitter:description"
            content="Compare today's best CD rates from top banks and credit unions. Updated daily with APYs and minimum deposits."
            data-default="true"
        />
        <meta name="twitter:image" content="https://cavicord.tech/og-image.png" data-default="true" />
        <title>Compare CD Rates — Today's Best CD Rates From Top Banks | Cavicord</title>
        <!-- Google tag (Google Ads AW-18545024484). The gtag() queue exists immediately so
             the lead-form conversion is never lost; the library itself loads after the page
             has rendered so it doesn't affect PageSpeed. Only on the live domain. -->
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() { dataLayer.push(arguments); }
            try {
                if (localStorage.getItem("cavicord_cookie_consent") === "declined") {
                    gtag("consent", "default", {
                        ad_storage: "denied",
                        ad_user_data: "denied",
                        ad_personalization: "denied",
                        analytics_storage: "denied",
                    });
                }
            } catch (e) {}
            gtag("js", new Date());
            gtag("config", "AW-18545024484");
            (function () {
                if (!/(^|\.)cavicord\.tech$/.test(location.hostname)) return;
                function load() {
                    var s = document.createElement("script");
                    s.async = true;
                    s.src = "https://www.googletagmanager.com/gtag/js?id=AW-18545024484";
                    document.head.appendChild(s);
                }
                if (document.readyState === "complete") load();
                else window.addEventListener("load", load);
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
