            {"@type": "Question", "name": "What is APY and how is it different from the interest rate?", "acceptedAnswer": {"@type": "Answer", "text": "APY (annual percentage yield) is the total return earned in one year including compounding, while the interest rate is the base rate before compounding. APY is the number to use when comparing CDs."}},
            {"@type": "Question", "name": "What happens if I withdraw early?", "acceptedAnswer": {"@type": "Answer", "text": "Most CDs charge an early withdrawal penalty, usually a set number of days or months of earned interest. Some banks offer no-penalty CDs at a slightly lower APY."}},
